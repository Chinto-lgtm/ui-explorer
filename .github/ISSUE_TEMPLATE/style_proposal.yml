name: Style proposal
description: Propose a new community style before opening a pull request
labels: [style contribution]
body:
  - type: input
    id: name
    attributes:
      label: Style name
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: [Morphism, Modern, Expressive, Futuristic, Retro, Minimalist]
    validations:
      required: true
  - type: textarea
    id: character
    attributes:
      label: Visual character
      description: What makes it a distinct construction rather than a palette swap — surfaces, depth, borders, motion, SVG language.
    validations:
      required: true
  - type: input
    id: extends
    attributes:
      label: Extends a built-in?
      description: Leave empty for a standalone package
      placeholder: cyberpunk
  - type: textarea
    id: refs
    attributes:
      label: References
      description: Links or images that show the look (must be yours to share or public)
