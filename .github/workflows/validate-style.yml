name: Validate community style contributions

on:
  pull_request:
    paths:
      - 'styles/community/**'
      - 'schemas/**'
      - 'tools/style-engine/**'

jobs:
  validate-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install -g npm@11 && npm ci

      - name: Validate every package in the registry
        run: cd tools/style-engine && python -m style_engine registry ../../styles/community/index.json

      - name: Load the registry through the app (inheritance, provenance, docs)
        run: npx vitest run src/styles/community/registry.test.ts

      - name: Build
        run: npm run build
