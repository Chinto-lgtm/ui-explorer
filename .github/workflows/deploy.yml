name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Set the repository variable PAGES_CUSTOM_DOMAIN (Settings → Secrets and variables →
    # Actions → Variables) to e.g. uiexplorer.dev once DNS points at GitHub Pages; the
    # site is then built for "/" and a CNAME file is published. Leave it unset for
    # https://<owner>.github.io/<repo>/.
    env:
      CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the app
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ vars.PAGES_CUSTOM_DOMAIN != '' && '/' || format('/{0}/', github.event.repository.name) }}
      - name: Build the docs site into dist/docs
        run: npm run docs:build
        env:
          DOCS_BASE_PATH: ${{ vars.PAGES_CUSTOM_DOMAIN != '' && '/docs/' || format('/{0}/docs/', github.event.repository.name) }}
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html
      - name: Custom domain
        if: env.CUSTOM_DOMAIN != ''
        run: echo "$CUSTOM_DOMAIN" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
